<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jira Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-900: #0a1628;
      --navy-800: #0f2040;
      --navy-700: #152a54;
      --navy-600: #1d3a6e;
      --navy-500: #254a8e;

      --sky-400:  #38bdf8;
      --sky-300:  #7dd3fc;
      --sky-200:  #bae6fd;
      --sky-100:  #e0f2fe;

      --white:    #ffffff;
      --text-main:#e8f4fd;
      --text-muted:#7eafd4;
      --text-dim: #4a7a9b;

      --danger:   #f87171;
      --danger-bg:#7f1d1d30;
      --success:  #34d399;
      --success-bg:#064e3b30;

      --radius-card: 18px;
      --radius-item: 12px;
      --radius-sm:    8px;
      --shadow-card: 0 32px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(56,189,248,.08);
      --shadow-item: 0 2px 12px rgba(0,0,0,.25);

      --t-fast:   150ms cubic-bezier(.4,0,.2,1);
      --t-mid:    250ms cubic-bezier(.4,0,.2,1);
      --t-spring: 350ms cubic-bezier(.34,1.56,.64,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy-900);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(37,74,142,.45) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(21,42,84,.6) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: linear-gradient(160deg, var(--navy-700) 0%, var(--navy-800) 100%);
      border: 1px solid rgba(56,189,248,.15);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: cardIn .5s var(--t-spring) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--sky-400), var(--sky-300), var(--sky-400));
      background-size: 200%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .card__header {
      padding: 2rem 1.75rem 1.5rem;
    }

    .card__eyebrow {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .9rem;
    }

    .badge {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--sky-400);
      background: rgba(56,189,248,.12);
      border: 1px solid rgba(56,189,248,.25);
      border-radius: 5px;
      padding: 3px 9px;
    }

    .task-counter {
      font-size: .72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,.05);
      border-radius: 20px;
      padding: 2px 10px;
    }
    .task-counter span { color: var(--sky-300); }

    .card__title {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    .card__title em {
      font-style: normal;
      color: var(--sky-400);
    }

    .card__subtitle {
      margin-top: .35rem;
      font-size: .8rem;
      color: var(--text-muted);
    }

    .input-area {
      padding: 0 1.75rem 1rem;
      display: flex;
      gap: .6rem;
    }

    .task-input {
      flex: 1;
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(56,189,248,.2);
      border-radius: var(--radius-sm);
      padding: .7rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
    }
    .task-input::placeholder { color: var(--text-dim); }
    .task-input:focus {
      border-color: var(--sky-400);
      background: rgba(56,189,248,.07);
      box-shadow: 0 0 0 3px rgba(56,189,248,.15);
    }

    .btn-create {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .7rem 1.25rem;
      background: var(--sky-400);
      color: var(--navy-900);
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
    }
    .btn-create:hover {
      background: var(--sky-300);
      box-shadow: 0 0 20px rgba(56,189,248,.4);
      transform: translateY(-1px);
    }
    .btn-create:active { transform: translateY(0) scale(.97); }

    .btn-create svg { flex-shrink: 0; }

    .error-msg {
      margin: 0 1.75rem .75rem;
      font-size: .75rem;
      color: var(--danger);
      height: 1rem;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity var(--t-fast), transform var(--t-fast);
    }
    .error-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .divider {
      height: 1px;
      background: rgba(56,189,248,.1);
      margin: 0 1.75rem .25rem;
    }

    .task-list-wrapper {
      padding: .75rem 1.25rem 1.25rem;
      min-height: 140px;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      padding: 2rem 0;
      color: var(--text-dim);
      text-align: center;
    }
    .empty-state svg { opacity: .4; }
    .empty-state p { font-size: .82rem; line-height: 1.6; }
    .empty-state.hidden { display: none; }

    .task-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(56,189,248,.1);
      border-radius: var(--radius-item);
      box-shadow: var(--shadow-item);
      cursor: default;
      transition:
        transform var(--t-spring),
        background var(--t-fast),
        border-color var(--t-fast),
        box-shadow var(--t-fast);

      animation: itemIn .3s var(--t-mid) both;
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(-10px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .task-item:hover {
      transform: scale(1.025);
      background: rgba(56,189,248,.07);
      border-color: rgba(56,189,248,.25);
      box-shadow: 0 6px 24px rgba(0,0,0,.3), 0 0 0 1px rgba(56,189,248,.12);
    }

    .task-item.removing {
      animation: itemOut .28s var(--t-mid) both;
      pointer-events: none;
    }
    @keyframes itemOut {
      from { opacity: 1; transform: scale(1);     max-height: 80px; margin-bottom: .55rem; }
      to   { opacity: 0; transform: scale(.95) translateX(12px); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
    }

    .task-check {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid rgba(56,189,248,.35);
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-spring);
    }
    .task-check::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--success);
      opacity: 0;
      transform: scale(0);
      transition: opacity var(--t-fast), transform var(--t-spring);
    }
    .task-item.completed .task-check {
      border-color: var(--success);
    }
    .task-item.completed .task-check::after {
      opacity: 1;
      transform: scale(1);
    }
    .task-check:hover {
      border-color: var(--sky-400);
      transform: scale(1.15);
    }

    .task-text {
      flex: 1;
      font-size: .88rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      word-break: break-word;
      transition: color var(--t-fast), text-decoration-color var(--t-fast);
      text-decoration-color: transparent;
    }
    .task-item.completed .task-text {
      color: var(--text-dim);
      text-decoration: line-through;
      text-decoration-color: var(--text-dim);
    }

    .task-actions {
      display: flex;
      gap: .3rem;
      opacity: 0;
      transition: opacity var(--t-fast);
      flex-shrink: 0;
    }
    .task-item:hover .task-actions { opacity: 1; }

    .btn-action {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 7px;
      background: rgba(255,255,255,.05);
      color: var(--text-muted);
      cursor: pointer;
      font-size: .8rem;
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
    }
    .btn-action:hover { transform: scale(1.12); }
    .btn-action.edit:hover  { background: rgba(56,189,248,.15); color: var(--sky-300); border-color: rgba(56,189,248,.3); }
    .btn-action.delete:hover{ background: var(--danger-bg);     color: var(--danger);  border-color: rgba(248,113,113,.3); }

    .card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.75rem;
      border-top: 1px solid rgba(56,189,248,.08);
      background: rgba(0,0,0,.15);
    }

    .btn-secondary {
      font-family: inherit;
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 7px;
      padding: .35rem .85rem;
      cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .btn-secondary:hover { background: rgba(248,113,113,.12); color: var(--danger); }

    .footer-hint {
      font-size: .7rem;
      color: var(--text-dim);
    }

    @media (max-width: 480px) {
      .input-area { flex-direction: column; }
      .task-actions { opacity: 1; }
      .card__title { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

<div class="card">

  <header class="card__header">
    <div class="card__eyebrow">
      <span class="badge">Sprint Board</span>
      <span class="task-counter"><span id="task-count">0</span> tareas</span>
    </div>
    <h1 class="card__title">Mis <em>Tareas</em></h1>
    <p class="card__subtitle">Organiza tu backlog · click en texto para completar</p>
  </header>

  <div class="input-area">
    <input
      type="text"
      id="task-input"
      class="task-input"
      placeholder="Escribe una nueva tarea…"
      maxlength="120"
      autocomplete="off"
    />
    <button id="create-btn" class="btn-create">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5"  y1="12" x2="19" y2="12"/>
      </svg>
      Crear
    </button>
  </div>

  <p class="error-msg" id="error-msg" aria-live="polite"></p>
  <div class="divider"></div>

  <div class="task-list-wrapper">
    <ul class="task-list" id="task-list"></ul>

    <div class="empty-state" id="empty-state">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      <p>No hay tareas aún.<br/>¡Añade una para empezar!</p>
    </div>
  </div>

  <footer class="card__footer">
    <button id="clear-done-btn" class="btn-secondary">Limpiar completadas</button>
    <span class="footer-hint">✎ editar · ✕ borrar</span>
  </footer>

</div>

<script>
  'use strict';

  // refs
  const input        = document.getElementById('task-input');
  const createBtn    = document.getElementById('create-btn');
  const taskList     = document.getElementById('task-list');
  const errorMsg     = document.getElementById('error-msg');
  const emptyState   = document.getElementById('empty-state');
  const taskCount    = document.getElementById('task-count');
  const clearDoneBtn = document.getElementById('clear-done-btn');

  //Estado
  const STORAGE_KEY = 'jira_card_tasks_v2';
  let tasks = [];

  //Persistencia
  function save()  { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  function load()  {
    try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { tasks = []; }
  }

  //Validación
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    clearTimeout(showError._t);
    showError._t = setTimeout(() => errorMsg.classList.remove('show'), 2800);
  }

  function buildNode(task) {
    const li = document.createElement('li');
    li.className = 'task-item' + (task.completed ? ' completed' : '');
    li.dataset.id = task.id;

    const check = document.createElement('button');
    check.className = 'task-check';
    check.setAttribute('aria-label', 'Completar');

    const span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = task.text;

    const actions = document.createElement('div');
    actions.className = 'task-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'btn-action edit';
    editBtn.dataset.action = 'edit';
    editBtn.setAttribute('aria-label', 'Editar');
    editBtn.textContent = '✎';

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-action delete';
    delBtn.dataset.action = 'delete';
    delBtn.setAttribute('aria-label', 'Eliminar');
    delBtn.textContent = '✕';

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    li.appendChild(check);
    li.appendChild(span);
    li.appendChild(actions);

    return li;
  }

  function renderAll() {
    taskList.innerHTML = '';
    tasks.forEach(t => taskList.appendChild(buildNode(t)));
    updateUI();
  }

  function updateUI() {
    taskCount.textContent = tasks.length;
    emptyState.classList.toggle('hidden', tasks.length > 0);
  }

  //crear tarea
  function handleCreate() {
    const text = input.value.trim();
    if (!text)          return showError('El título no puede estar vacío.');
    if (text.length < 2) return showError('Mínimo 2 caracteres.');

    const task = {
      id: `t_${Date.now()}`,
      text,
      completed: false,
    };
    tasks.push(task);
    save();

    const node = buildNode(task);
    taskList.appendChild(node);

    input.value = '';
    errorMsg.classList.remove('show');
    updateUI();
  }

  taskList.addEventListener('click', (e) => {
    const li = e.target.closest('.task-item');
    if (!li) return;

    const id = li.dataset.id;
    const target = e.target;

    //Completar
    if (target.classList.contains('task-check') ||
        target.classList.contains('task-text')) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      li.classList.toggle('completed');
      save();
      return;
    }

    //Editar
    if (target.dataset.action === 'edit') {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const newText = prompt('Editar tarea:', task.text);
      if (newText === null) return;
      const trimmed = newText.trim();
      if (!trimmed) { showError('El texto no puede estar vacío.'); return; }
      task.text = trimmed;
      save();
      li.querySelector('.task-text').textContent = trimmed;
      return;
    }

    //eliminar
    if (target.dataset.action === 'delete') {
      tasks = tasks.filter(t => t.id !== id);
      save();

      li.classList.add('removing');
      li.addEventListener('animationend', () => {
        li.parentNode?.removeChild(li);
        updateUI();
      }, { once: true });
    }
  });

  createBtn.addEventListener('click', handleCreate);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleCreate(); });

  clearDoneBtn.addEventListener('click', () => {
    const completed = taskList.querySelectorAll('.task-item.completed');
    if (!completed.length) return;

    completed.forEach(li => {
      const id = li.dataset.id;
      tasks = tasks.filter(t => t.id !== id);

      li.classList.add('removing');
      li.addEventListener('animationend', () => {
        li.parentNode?.removeChild(li);
        updateUI();
      }, { once: true });
    });
    save();
  });

  document.addEventListener('DOMContentLoaded', () => {
    load();
    renderAll();
  });
</script>

</body>
</html>
